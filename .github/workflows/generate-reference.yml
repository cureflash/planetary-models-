name: Validate USNO W2J00 Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_usno_w2j00_mars.py"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/fetch_usno_w2j00_mars.py"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download and validate W2J00 Mars observations
        run: python tools/fetch_usno_w2j00_mars.py
      - uses: actions/upload-artifact@v4
        with:
          name: usno-w2j00-mars-validation
          path: |
            data/mars_observations_usno_w2j00.csv
            data/mars_observations_carlsberg.csv
