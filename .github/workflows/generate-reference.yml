name: Generate Carlsberg Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_carlsberg_i256_mars.py"
      - "tools/inspect_carlsberg_volumes.py"
      - "tools/fit_ptolemy_models.py"
      - "js/app-v4.js"
      - "js/observation-frames.js"
      - "models/ptolemy/**"
      - "index.html"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/fetch_carlsberg_i256_mars.py"
      - "tools/inspect_carlsberg_volumes.py"
      - "tools/fit_ptolemy_models.py"
      - "js/app-v4.js"
      - "js/observation-frames.js"
      - "models/ptolemy/**"
      - "index.html"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Inspect original Carlsberg volume planet tables
        run: python tools/inspect_carlsberg_volumes.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carlsberg-volume-inspection
          path: tools/inspect_carlsberg_volumes.py
