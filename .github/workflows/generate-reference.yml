name: Inspect real Mars observation coverage

on:
  push:
    branches: [main]
    paths:
      - "tools/inspect_jpl_meridian_mars.py"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_jpl_meridian_mars.py"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Measure JPL meridian-circle Mars coverage
        run: python tools/inspect_jpl_meridian_mars.py
