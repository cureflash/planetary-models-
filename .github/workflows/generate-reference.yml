name: Generate USNO W2J00 Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_usno_w2j00_mars.py"
      - "tools/fit_ptolemy_models.py"
      - "js/app-v3.js"
      - "js/app-v4.js"
      - "js/data-bootstrap.js"
      - "js/observation-frames.js"
      - "models/ptolemy/**"
      - "index.html"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/fetch_usno_w2j00_mars.py"
      - "tools/fit_ptolemy_models.py"
      - "js/app-v3.js"
      - "js/app-v4.js"
      - "js/data-bootstrap.js"
      - "js/observation-frames.js"
      - "models/ptolemy/**"
      - "index.html"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install fitting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Download and validate USNO W2J00 Mars observations
        run: python tools/fetch_usno_w2j00_mars.py

      - name: Fit Ptolemy stages to W2J00 observations
        run: python tools/fit_ptolemy_models.py

      - name: Check browser JavaScript syntax
        run: |
          node --check js/app-v3.js
          node --check js/app-v4.js
          node --check js/data-bootstrap.js
          node --check js/observation-frames.js
          node --check models/ptolemy/01-simple-circle.js
          node --check models/ptolemy/02-epicycle.js
          node --check models/ptolemy/03-epicycle-eccentric.js
          node --check models/ptolemy/04-equant.js
          node --check models/ptolemy/fitted-parameters.js
          node --check models/ptolemy/fitted-parameters-w2j00.js
          node --check models/ptolemy/fitted-parameters-jpl.js

      - name: Verify restored JPL reference data
        run: |
          test -f data/mars_reference_2020_2030.csv
          head -n 1 data/mars_reference_2020_2030.csv | grep -q 'earth_x_au'
          test "$(wc -l < data/mars_reference_2020_2030.csv)" -gt 3600

      - name: Upload generated data for validation
        uses: actions/upload-artifact@v4
        with:
          name: usno-w2j00-mars-generated
          path: |
            data/mars_observations_usno_w2j00.csv
            data/mars_observations_carlsberg.csv
            data/ptolemy_mars_fitted_parameters.json
            models/ptolemy/fitted-parameters-w2j00.js

      - name: Commit generated observation data and fits
        run: |
          FILES="data/mars_observations_usno_w2j00.csv data/mars_observations_carlsberg.csv data/ptolemy_mars_fitted_parameters.json models/ptolemy/fitted-parameters-w2j00.js"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "W2J00 data and fitted parameters already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update USNO W2J00 Mars observations and fits"
          git push
