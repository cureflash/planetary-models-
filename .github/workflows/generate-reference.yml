name: Generate Carlsberg Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/inspect_carlsberg_ftp.py"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_carlsberg_ftp.py"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Inspect original Carlsberg FTP planet tables
        run: python tools/inspect_carlsberg_ftp.py
