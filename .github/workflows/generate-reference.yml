name: Generate Carlsberg Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_carlsberg_mars.py"
      - "tools/fit_ptolemy_models.py"
      - ".github/workflows/generate-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install fitting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Download Carlsberg Mars observations from VizieR
        run: python tools/fetch_carlsberg_mars.py

      - name: Fit Ptolemy stages to the observations
        run: python tools/fit_ptolemy_models.py

      - name: Commit generated observation data and fits
        run: |
          FILES="data/mars_observations_carlsberg_1984_1998.csv data/ptolemy_mars_fitted_parameters.json models/ptolemy/fitted-parameters.js"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Carlsberg data and fitted parameters already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update Carlsberg Mars observations and fits"
          git push
