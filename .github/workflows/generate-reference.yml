name: Generate Carlsberg Mars observations

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_carlsberg_mars.py"
      - "tools/fit_ptolemy_models.py"
      - ".github/workflows/generate-reference.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/fetch_carlsberg_mars.py"
      - "tools/fit_ptolemy_models.py"
      - ".github/workflows/generate-reference.yml"
      - "tools/carlsberg-pipeline-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install fitting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Download Carlsberg Mars observations from CDS mirrors
        run: python tools/fetch_carlsberg_mars.py

      - name: Fit Ptolemy stages to the observations
        run: python tools/fit_ptolemy_models.py

      - name: Upload generated data for validation
        uses: actions/upload-artifact@v4
        with:
          name: carlsberg-mars-generated
          path: |
            data/mars_observations_carlsberg.csv
            data/ptolemy_mars_fitted_parameters.json
            models/ptolemy/fitted-parameters.js

      - name: Commit generated observation data and fits
        run: |
          FILES="data/mars_observations_carlsberg.csv data/ptolemy_mars_fitted_parameters.json models/ptolemy/fitted-parameters.js"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Carlsberg data and fitted parameters already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update aggregated Carlsberg Mars observations and fits"
          git push
