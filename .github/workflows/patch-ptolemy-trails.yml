name: Patch Ptolemy comparison trails

on:
  push:
    branches: [align-ptolemy-observation-trails]
    paths:
      - "tools/patch_align_ptolemy_trails.py"
      - ".github/workflows/patch-ptolemy-trails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-ptolemy-observation-trails
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Align Ptolemy model and observation sampling
        run: python tools/patch_align_ptolemy_trails.py
      - name: Check JavaScript syntax
        run: node --check js/app-v4.js
      - name: Commit patched files
        run: |
          if [ -z "$(git status --porcelain -- js/app-v4.js index.html)" ]; then
            echo "Already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v4.js index.html
          git commit -m "Align Ptolemy model and observation trails"
          git push
